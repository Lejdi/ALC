apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-parcelize'

android {
    signingConfigs {
        alc_release_config {

            def signingProperties = new Properties()
            signingProperties.load(new FileInputStream(rootProject.file("signing.properties")))

            storeFile file('C:\\Users\\Lejdi\\StudioProjects\\ALC_release_key_config\\key_store.jks')
            keyAlias 'key0'
            storePassword signingProperties['key.passwd']
            keyPassword signingProperties['key.passwd']
        }
    }
    compileSdk 35

    defaultConfig {
        applicationId "pl.lejdi.alc"
        minSdkVersion 23
        targetSdkVersion 35
        versionCode 11
        versionName "2.1"

    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = "21"
    }

    buildFeatures {
        viewBinding true
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion "1.5.15"
        kotlinCompilerVersion "1.5.15"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.alc_release_config
        }
        qa {
            applicationIdSuffix ".qa"
            signingConfig signingConfigs.debug
        }
    }
    namespace 'pl.lejdi.alc'
}

def githubProperties = new Properties()
githubProperties.load(new FileInputStream(rootProject.file("github.properties")))
repositories {
    maven {
        name = "GitHubPackages"
        url = uri("https://maven.pkg.github.com/Lejdi/ALC")
        credentials {
            username = githubProperties['gpr.usr']
            password = githubProperties['gpr.key']
        }
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation project(path: ':ALCMusicPlayer')

    //recyclerview
    implementation 'androidx.recyclerview:recyclerview:1.4.0'

    //local broadcast
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'

    //media
    implementation "androidx.media:media:1.7.0"

    //fragment
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'com.google.android.material:material:1.12.0'

    //hawk
    implementation "com.orhanobut:hawk:2.0.1"

    //coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.7'

    //fast scrolling recyclerview
    implementation 'xyz.danoz:recyclerviewfastscroller:0.1.3'

    //compose
    implementation "androidx.compose.ui:ui:$compose_version"
    implementation "androidx.compose.material:material:$compose_version"
    implementation "androidx.compose.ui:ui-tooling:$compose_version"
    implementation "androidx.activity:activity-compose:1.10.0"
    implementation "androidx.compose.material:material-icons-extended:$compose_version"

    implementation "androidx.navigation:navigation-compose:2.8.6"

    implementation project(path: ':FilesystemFragment')
}